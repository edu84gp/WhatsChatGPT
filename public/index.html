<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WhatsChatGPT</title>
  <link rel="stylesheet" href="src/css/style.css">
</head>
<body>

  <div class="chat-wrapper">
    <header class="chat-header">
      <div class="chat-header-info">
        <div class="chat-avatar" title="Grupo del Chat">💬</div>
        <div class="chat-title-group">
          <h1 class="chat-title">WhatsChatGPT</h1>
          <div class="chat-status" id="chat-status">
            <span class="status-dot disconnected" id="status-dot"></span>
            <span class="status-text" id="status-text">conectando...</span>
          </div>
        </div>
      </div>

      <div class="chat-user-config">
        <label for="username-input">Tú:</label>
        <input 
          type="text" 
          id="username-input" 
          placeholder="Tu nombre..." 
          maxlength="16"
        >
      </div>
    </header>

    <!-- Área de mensajes -->
    <main class="chat-messages" id="chat-messages">
      <div class="system-message">
        <span>🔒 Los mensajes no se guardan en el servidor.</span>
      </div>
    </main>

    <footer class="chat-footer">
      <form id="chat-form" class="chat-form">
        <input 
          type="text" 
          id="message-input" 
          placeholder="Escribe un mensaje aquí" 
          autocomplete="off" 
          required
        >
        <button type="submit" id="send-button" title="Enviar mensaje">
          <svg class="send-icon" viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </form>
    </footer>

  </div>

  <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="src/js/script.js"></script>
</body>
</html>
